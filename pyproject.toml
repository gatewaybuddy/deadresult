[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadresult"
version = "0.1.0"
description = "Searchable catalog of failed AI research experiments — stop repeating dead ends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "DeadResult", email = "hello@deadresult.agentpier.org" }]
keywords = ["ai", "research", "experiments", "failures", "catalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "httpx>=0.27,<1",
    "psycopg2-binary>=2.9,<3",
    "click>=8.1,<9",
    "rich>=13,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-httpx>=0.30,<1",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "ruff>=0.3,<1",
]

[project.scripts]
deadresult = "deadresult.cli.main:cli"

[project.urls]
Homepage = "https://deadresult.agentpier.org"
Repository = "https://github.com/agentpier/deadresult"

[tool.hatch.build.targets.wheel]
packages = ["deadresult"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
