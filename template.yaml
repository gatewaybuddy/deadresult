AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DeadResult — Searchable catalog of failed AI research experiments

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  DBPassword:
    Type: String
    NoEcho: true
    Description: Password for the RDS PostgreSQL instance
    MinLength: 8
  DomainName:
    Type: String
    Default: deadresult.agentpier.org
    Description: Custom domain for API Gateway
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for custom domain (us-east-1)

Conditions:
  IsProduction: !Equals [!Ref Stage, prod]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:

  # ============================================
  # VPC Configuration
  # ============================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub deadresult-vpc-${Stage}

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub deadresult-private-1-${Stage}

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub deadresult-private-2-${Stage}

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub deadresult-public-1-${Stage}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub deadresult-public-2-${Stage}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub deadresult-igw-${Stage}

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub deadresult-public-rt-${Stage}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub deadresult-nat-${Stage}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub deadresult-private-rt-${Stage}

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ============================================
  # Security Groups
  # ============================================
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub deadresult-lambda-sg-${Stage}
      GroupDescription: Security group for DeadResult Lambda functions
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: "All outbound traffic"
      Tags:
        - Key: Name
          Value: !Sub deadresult-lambda-sg-${Stage}

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub deadresult-rds-sg-${Stage}
      GroupDescription: Security group for DeadResult RDS instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: "Lambda access to PostgreSQL"
      Tags:
        - Key: Name
          Value: !Sub deadresult-rds-sg-${Stage}

  # ============================================
  # RDS PostgreSQL (pgvector)
  # ============================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for DeadResult RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub deadresult-db-subnets-${Stage}

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub deadresult-${Stage}
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: "16.4"
      AllocatedStorage: 20
      StorageType: gp3
      DBName: deadresult
      MasterUsername: deadresult
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: !If [IsProduction, 7, 1]
      DeletionProtection: !If [IsProduction, true, false]
      Tags:
        - Key: Name
          Value: !Sub deadresult-db-${Stage}

  # ============================================
  # S3 Bucket — Bulk Exports
  # ============================================
  ExportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub deadresult-exports-${Stage}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldExports
            Status: Enabled
            ExpirationInDays: 30
            Prefix: exports/
      Tags:
        - Key: Name
          Value: !Sub deadresult-exports-${Stage}

  # ============================================
  # API Gateway HTTP API
  # ============================================
  DeadResultApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-API-Key

  # ============================================
  # Lambda Function (Mangum handler)
  # ============================================
  DeadResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub deadresult-api-${Stage}
      Handler: deadresult.api.lambda_handler.handler
      CodeUri: .
      MemorySize: 512
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          DEADRESULT_DATABASE_URL: !Sub
            - "postgresql+asyncpg://deadresult:${Password}@${Host}:5432/deadresult"
            - Password: !Ref DBPassword
              Host: !GetAtt Database.Endpoint.Address
          DEADRESULT_DATABASE_URL_SYNC: !Sub
            - "postgresql://deadresult:${Password}@${Host}:5432/deadresult"
            - Password: !Ref DBPassword
              Host: !GetAtt Database.Endpoint.Address
          DEADRESULT_S3_BUCKET: !Ref ExportBucket
          DEADRESULT_AWS_REGION: !Ref AWS::Region
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ExportBucket
        - VPCAccessPolicy: {}
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeadResultApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeadResultApi
            Path: /
            Method: ANY

  # ============================================
  # Custom Domain (optional)
  # ============================================
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCertificate
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCertificate
    DependsOn: ApiDomainName
    Properties:
      ApiId: !Ref DeadResultApi
      DomainName: !Ref DomainName
      Stage: !Ref Stage

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${DeadResultApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DeadResultFunction.Arn
  DatabaseEndpoint:
    Description: RDS endpoint address
    Value: !GetAtt Database.Endpoint.Address
  ExportBucketName:
    Description: S3 bucket for bulk exports
    Value: !Ref ExportBucket
